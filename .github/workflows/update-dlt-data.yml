name: 大乐透开奖数据自动同步

# 大乐透开奖：每周一 / 三 / 六 约 21:25（北京时间）。
# GitHub Actions 的 cron 用 UTC，所以 UTC 13:xx~15:30 = 北京 21:xx~23:30。
# 21:26 首次尝试（开奖后 1 分钟）；但开奖结果上网通常还要几分钟，
# 且 GitHub cron 不保证准点，故开奖后密集重试 6 次，谁先抓到谁同步，
# 之后的运行都是 NO_CHANGE、不产生空提交；每天上午再兜底一次。
on:
  schedule:
    - cron: '26 13 * * 1,3,6'   # 北京 周一/三/六 21:26（用户指定，开奖后立刻试）
    - cron: '34 13 * * 1,3,6'   # 北京 周一/三/六 21:34（数据上网后重试）
    - cron: '45 13 * * 1,3,6'   # 北京 周一/三/六 21:45
    - cron: '15 14 * * 1,3,6'   # 北京 周一/三/六 22:15
    - cron: '45 14 * * 1,3,6'   # 北京 周一/三/六 22:45
    - cron: '30 15 * * 1,3,6'   # 北京 周一/三/六 23:30
    - cron: '0 2 * * *'         # 每天 北京 10:00 兜底
  workflow_dispatch:            # 可在 Actions 页面手动点「Run workflow」

permissions:
  contents: write
  pages: write                  # 允许显式触发 Pages 重新部署

concurrency:
  group: update-dlt-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 500 彩票网并同步数据
        run: python3 scripts/update_dlt_data.py

      - name: 有新开奖则提交并推送
        id: sync
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有新开奖，跳过提交"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: 自动同步大乐透开奖数据"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::已推送，等待 Pages 部署"

      # GITHUB_TOKEN 发起的 push 不保证触发 Pages 构建，显式请求一次。
      # 若 GitHub 已自动开始构建，接口会返回冲突，忽略即可。
      - name: 触发 GitHub Pages 重新部署
        if: steps.sync.outputs.pushed == 'true'
        run: |
          CODE=$(curl -sS -o /tmp/pages_build.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          echo "Pages build API: HTTP $CODE"
          if [ "$CODE" = "201" ] || [ "$CODE" = "204" ]; then
            echo "::notice::已显式触发 Pages 重新部署"
          else
            echo "::notice::Pages 可能已自动构建或正在构建中，跳过"
          fi

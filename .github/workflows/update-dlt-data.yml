name: 大乐透开奖数据自动同步

# 大乐透开奖：每周一 / 三 / 六 约 21:25（北京时间）。
# GitHub Actions 的 cron 用 UTC，所以 UTC 13:00~15:30 = 北京 21:00~23:30。
# 开奖结果一般在 21:40~22:30 之间公布，故在开奖日晚间多次尝试；每天上午再兜底一次。
on:
  schedule:
    - cron: '45 13 * * 1,3,6'   # 北京 周一/三/六 21:45
    - cron: '15 14 * * 1,3,6'   # 北京 周一/三/六 22:15
    - cron: '45 14 * * 1,3,6'   # 北京 周一/三/六 22:45
    - cron: '30 15 * * 1,3,6'   # 北京 周一/三/六 23:30
    - cron: '0 2 * * *'         # 每天 北京 10:00 兜底
  workflow_dispatch:            # 可在 Actions 页面手动点「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-dlt-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 500 彩票网并同步数据
        run: python3 scripts/update_dlt_data.py

      - name: 有新开奖则提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::没有新开奖，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动同步大乐透开奖数据"
          git push
          echo "::notice::已推送，GitHub Pages 稍后自动部署"
